spring.application.name=db-sync

# Server Configuration
server.port=8083

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9072
spring.kafka.consumer.group-id=db-sync-consumer-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.max-poll-records=1
# SASL/PLAIN (required - broker uses SASL; db-sync consumes from order-db-sync, transaction-db-sync)
spring.kafka.security.protocol=SASL_PLAINTEXT
spring.kafka.sasl.mechanism=PLAIN
spring.kafka.sasl.username=dbsync
spring.kafka.sasl.password=dbsync-secret

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=create-drop
#spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Logging
logging.level.com.mine.ordersync=INFO
logging.level.org.springframework.kafka=INFO
logging.level.org.hibernate.SQL=DEBUG
