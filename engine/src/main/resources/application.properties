spring.application.name=engine

# Messaging Provider Configuration
# Set to "rabbitmq" or "kafka" to switch between messaging systems
# Default: kafka
messaging.provider=kafka

# RabbitMQ Configuration
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=admin
spring.rabbitmq.password=admin
spring.rabbitmq.virtual-host=/
spring.rabbitmq.listener.simple.auto-startup=true
spring.rabbitmq.listener.simple.acknowledge-mode=manual
# Synchronous processing settings - one message at a time
spring.rabbitmq.listener.simple.concurrency=1
spring.rabbitmq.listener.simple.max-concurrency=1
spring.rabbitmq.listener.simple.prefetch=1

# Kafka Configuration (order-events: consume only; main produces)
spring.kafka.bootstrap-servers=localhost:9072
spring.kafka.consumer.group-id=engine-order-consumer-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.max-poll-records=1
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.enable-idempotence=true

# SASL/PLAIN (engine can only consume from order-events)
spring.kafka.security.protocol=SASL_PLAINTEXT
spring.kafka.sasl.mechanism=PLAIN
spring.kafka.sasl.username=engine
spring.kafka.sasl.password=engine-secret

# Snapshot Configuration
snapshot.path=data/snapshots
snapshot.enabled=true
snapshot.interval.seconds=10

# Snapshot S3 Configuration (optional)
# Enable this once you provide bucket/keys.
snapshot.s3.enabled=true
 snapshot.s3.bucket=amzn-exchange-s3-bucket
 snapshot.s3.region=ap-south-1
 snapshot.s3.key=engine/stockData.snapshot
# If access/secret are empty, the app will use the default AWS credential chain (env/instance profile/etc.)
 snapshot.s3.access-key=AKIA6KW7VOD4CFJAZ4GT
 snapshot.s3.secret-key=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
# Optional (useful for S3-compatible storage like MinIO)
# snapshot.s3.endpoint=
# snapshot.s3.path-style-access=false
# If true, loadSnapshot prefers S3 even if local file exists
snapshot.s3.prefer=true

# Database Configuration
spring.datasource.url=${DB_CONNECTION_STRING:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Redis Configuration for Idempotency
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0

server.port=8080
