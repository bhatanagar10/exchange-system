spring.application.name=engine

# Messaging Provider Configuration
# Set to "rabbitmq" or "kafka" to switch between messaging systems
# Default: kafka
messaging.provider=kafka

# RabbitMQ Configuration
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=admin
spring.rabbitmq.password=admin
spring.rabbitmq.virtual-host=/
spring.rabbitmq.listener.simple.auto-startup=true
spring.rabbitmq.listener.simple.acknowledge-mode=manual
# Synchronous processing settings - one message at a time
spring.rabbitmq.listener.simple.concurrency=1
spring.rabbitmq.listener.simple.max-concurrency=1
spring.rabbitmq.listener.simple.prefetch=1

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9072
spring.kafka.consumer.group-id=engine-order-consumer-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.max-poll-records=1
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.enable-idempotence=true

# Topic Configuration (for auto-creation)
spring.kafka.topic.partitions=1
spring.kafka.topic.replication-factor=1

# Admin Client Configuration
# Set to true if you want app to fail if Kafka is not available at startup
spring.kafka.admin.fail-fast=false

# Snapshot Configuration
snapshot.path=data/snapshots
snapshot.enabled=true
snapshot.interval.seconds=10

# Database Configuration
spring.datasource.url=${DB_CONNECTION_STRING:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

server.port=8080
